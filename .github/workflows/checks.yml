name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install "homeassistant==2026.10.4" "pycryptodome>=3.23.0" "requests>=2.32.5" ruff
      - name: Static checks
        run: ruff check --select F,E9 --exclude _vendor .
      - name: Tests
        run: python -m unittest discover -s tests -v
