<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>登录米家 · 体重秤云同步</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f8;color:#20252b}
main{box-sizing:border-box;width:min(390px,calc(100vw - 32px));padding:28px;border-radius:20px;background:#fff;box-shadow:0 8px 36px #0000000c;text-align:center}
h1{margin:0 0 12px;font-size:24px}p{font-size:14px;line-height:1.7;color:#596472}
#qr{display:block;width:220px;height:220px;max-width:100%;object-fit:contain;margin:22px auto;background:white;border-radius:8px}
#qr[hidden]{display:none}#status{min-height:48px}#remaining{font-variant-numeric:tabular-nums;font-size:13px}
button{font:inherit;width:100%;padding:12px;border:0;border-radius:10px;background:#147d92;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}
a{color:#147d92;font-size:14px}#return{display:none;margin-top:18px}
@media(prefers-color-scheme:dark){body{background:#14171c;color:#edf0f5}main{background:#222831}p{color:#b5c0cd}a{color:#77cadd}}
</style>
<main>
<h1>登录米家</h1>
<p>打开米家 App 的「扫一扫」<br>扫码并在手机上确认登录</p>
<img id="qr" alt="米家登录二维码" hidden referrerpolicy="no-referrer">
<p id="status" role="status" aria-live="polite">正在准备二维码…</p>
<p id="remaining"></p>
<button id="refresh" type="button">刷新二维码</button>
<a id="return" href="/config/integrations">返回 Home Assistant</a>
</main>
<script nonce="__NONCE__">
const base=location.pathname.replace(/\/$/,""), token=base.split("/").pop();
const image=document.querySelector("#qr"),status=document.querySelector("#status");
const remaining=document.querySelector("#remaining"),button=document.querySelector("#refresh");
let timer=null,terminal=false,busy=false,failed=0;
const messages={idle:"正在准备二维码…",starting:"正在生成二维码…",pending:"等待手机确认，登录成功后会自动继续。",expired:"二维码已过期，请点击下方按钮刷新。",closed:"已停止等待。点击刷新二维码可重新开始。",error:"连接失败，请稍后刷新二维码重试。",wrong_account:"请使用原来的米家账号，刷新后重新扫码。",success:"登录成功，正在返回 Home Assistant…"};
async function request(action,method="GET"){
 const response=await fetch(base+"/"+action,{method,cache:"no-store",headers:method==="POST"?{"X-Scale-Login":token}:{}});
 if(!response.ok)throw new Error(String(response.status));
 return response.json();
}
function schedule(){clearTimeout(timer);if(!terminal)timer=setTimeout(poll,2000);}
function render(data){
 status.textContent=messages[data.status]||"登录连接已中断，请刷新重试。";
 terminal=!["idle","starting","pending"].includes(data.status);
 if(data.qr_url){if(image.src!==data.qr_url)image.src=data.qr_url;image.hidden=false;}else image.hidden=true;
 remaining.textContent=data.status==="pending"?"有效时间约 "+Math.ceil(data.expires_in/60)+" 分钟":"";
 button.disabled=busy||data.status==="success";
 if(data.status==="success"){
  document.querySelector("#return").style.display="block";
  try{if(window.opener&&!window.opener.closed){window.opener.focus();window.close();}}catch(e){}
 }
}
async function poll(){
 if(terminal)return;
 try{render(await request("status"));failed=0;}
 catch(e){if(++failed>=3){terminal=true;status.textContent="连接已中断，请刷新二维码重试。";}}
 schedule();
}
async function refresh(){
 if(busy)return;
 busy=true;terminal=true;clearTimeout(timer);button.disabled=true;status.textContent="正在生成二维码…";
 try{render(await request("refresh","POST"));failed=0;}
 catch(e){status.textContent=e.message==="410"?"页面已失效，请返回 Home Assistant 重新开始。":"刷新失败，请稍后重试。";}
 finally{busy=false;button.disabled=status.textContent===messages.success;schedule();}
}
button.addEventListener("click",refresh);
window.addEventListener("pagehide",()=>{
 clearTimeout(timer);
 if(!terminal||busy)fetch(base+"/stop",{method:"POST",headers:{"X-Scale-Login":token},keepalive:true}).catch(()=>{});
});
(async()=>{
 try{const data=await request("status");if(data.status==="idle")await refresh();else{render(data);schedule();}}
 catch(e){terminal=true;status.textContent="页面已失效，请返回 Home Assistant 重新开始。";document.querySelector("#return").style.display="block";}
})();
</script>
</html>
